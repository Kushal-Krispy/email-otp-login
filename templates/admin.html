<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campus Lost — User Management</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f8;color:#18242b;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1500px;margin:auto;padding:25px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:18px}.kicker{font-size:10px;font-weight:900;letter-spacing:.14em;color:#668079}.top h1{margin:5px 0}.sub{color:#718089;font-size:13px}.actions{display:flex;gap:9px}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:900;cursor:pointer}.back{background:#e9f0ee;color:#235c50}.refresh{background:#216a5b;color:#fff}.card{background:#fff;border:1px solid #dfe7e9;border-radius:17px;padding:18px;box-shadow:0 10px 28px rgba(25,50,58,.05)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1120px}th,td{padding:11px 9px;border-bottom:1px solid #edf0f1;text-align:left;font-size:12px}th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#738089;background:#fafcfc}.status{font-weight:900}.online{color:#087443}.offline{color:#8a94a4}.mini{border:0;border-radius:8px;padding:7px 9px;font-size:11px;font-weight:900;cursor:pointer;margin-right:4px}.edit{background:#edf5f2;color:#245f52}.delete{background:#fff0ee;color:#a53127}.empty{padding:30px;text-align:center;color:#7b8790}.msg{font-size:12px;min-height:20px;margin:3px 0 10px}.error{color:#b42318}.success{color:#087443}.modal{display:none;position:fixed;inset:0;background:rgba(17,31,28,.5);align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.modal-card{width:min(550px,100%);background:#fff;border-radius:18px;padding:24px}.modal-card h2{margin-top:0}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:900;margin-bottom:6px}.field input,.field select{width:100%;height:42px;border:1px solid #d7e0e2;border-radius:9px;padding:0 11px;background:#fff}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:17px}.save{background:#216a5b;color:#fff}.cancel{background:#edf1f2}
</style></head>
<body><div class="wrap"><div class="top"><div><div class="kicker">Campus Lost · Administration</div><h1>Registered Users</h1><div class="sub">Manage accounts stored in Supabase <b>public.users</b>. Password hashes are never displayed.</div></div><div class="actions"><button class="btn back" onclick="location.href='/dashboard'">← Dashboard</button><button class="btn refresh" onclick="loadUsers()">↻ Refresh</button></div></div><div class="card"><div id="msg" class="msg"></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Date of birth</th><th>College</th><th>Email</th><th>Verified</th><th>Login</th><th>Created</th><th>Last login</th><th>Actions</th></tr></thead><tbody id="usersBody"></tbody></table><div id="empty" class="empty" style="display:none">No registered users found.</div></div></div></div>
<div class="modal" id="modal"><div class="modal-card"><h2>Edit user</h2><input type="hidden" id="editId"><div class="field"><label>Name</label><input id="editName"></div><div class="field"><label>Date of birth</label><input id="editDob" type="date"></div><div class="field"><label>College name</label><input id="editCollege"></div><div class="field"><label>Email</label><input id="editEmail" type="email"></div><div class="field"><label>Email verified</label><select id="editVerified"><option value="true">Yes</option><option value="false">No</option></select></div><div class="modal-actions"><button class="btn cancel" onclick="closeModal()">Cancel</button><button class="btn save" onclick="saveUser()">Save changes</button></div><div id="modalMsg" class="msg"></div></div></div>
<script>
const $=id=>document.getElementById(id);let users=[];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(v){return v?new Date(v).toLocaleString():'—'}
async function loadUsers(){try{const r=await fetch('/admin/users');const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not load users');users=d.users||[];$('usersBody').innerHTML=users.map(u=>`<tr><td>${u.id}</td><td><b>${esc(u.name)}</b></td><td>${esc(u.date_of_birth)}</td><td>${esc(u.college_name)}</td><td>${esc(u.email)}</td><td>${u.email_verified?'Yes':'No'}</td><td class="status ${u.is_logged_in?'online':'offline'}">${u.is_logged_in?'Online':'Offline'}</td><td>${fmt(u.created_at)}</td><td>${fmt(u.last_login_at)}</td><td><button class="mini edit" onclick="openEdit(${u.id})">Edit</button><button class="mini delete" onclick="deleteUser(${u.id})">Delete</button></td></tr>`).join('');$('empty').style.display=users.length?'none':'block';$('msg').textContent=''}catch(e){$('msg').textContent=e.message;$('msg').className='msg error'}}
function openEdit(id){const u=users.find(x=>x.id===id);if(!u)return;$('editId').value=u.id;$('editName').value=u.name||'';$('editDob').value=u.date_of_birth||'';$('editCollege').value=u.college_name||'';$('editEmail').value=u.email||'';$('editVerified').value=String(!!u.email_verified);$('modalMsg').textContent='';$('modal').classList.add('open')}
function closeModal(){$('modal').classList.remove('open')}
async function saveUser(){try{const id=$('editId').value;const payload={name:$('editName').value,date_of_birth:$('editDob').value,college_name:$('editCollege').value,email:$('editEmail').value,email_verified:$('editVerified').value==='true'};const r=await fetch('/admin/users/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw new Error(d.error||'Update failed');closeModal();await loadUsers();$('msg').textContent='User updated successfully.';$('msg').className='msg success'}catch(e){$('modalMsg').textContent=e.message;$('modalMsg').className='msg error'}}
async function deleteUser(id){if(!confirm('Delete this user and their OTP records? This cannot be undone.'))return;try{const r=await fetch('/admin/users/'+id,{method:'DELETE'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Delete failed');await loadUsers();$('msg').textContent='User deleted successfully.';$('msg').className='msg success'}catch(e){$('msg').textContent=e.message;$('msg').className='msg error'}}
loadUsers();
</script></body></html>
